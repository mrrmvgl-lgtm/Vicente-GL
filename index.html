<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="autor" content="Vicente García">
    <title>Gifts & Tips for Christmas Eve</title>
    <base href="Index.html">
    <link rel="stylesheet" type="text/css" href="css/juego.css">
    <link rel="stylesheet" type="text/css" media="screen and (min-width: 501px) and (max-width: 1000px)" href="css/juegotab.css">
    <link rel="stylesheet" type="text/css" media="screen and (max-width: 500px)" href="css/juegotel.css">
    <link rel="icon" href="images/juego.webp" type="images/webp" sizes="16x16">  
    <script src="javas/juego.js"></script>
</head>
<body class="home">
    <header> <!-- Common to all pages -->
        <div class="flex-container">
            <div class="flex5">
                <a href="index.html">
                    <img id="icono" src="images/juego.webp" alt="logotipo">
                </a>
            </div>
            <hgroup class="flex5">
                <h1>Piedra, Papel o Tijera</h1>
                <p>The funniest game</p>
            </hgroup>
        </div>
    </header>

    <!-- tronco de la página -->
    <main>
        <nav class="flex-container">
                <div class="left_f">
                    <label><b>Machine</b></label>
                </div>
                <div class="flex1">
                    <input id="restart" type="submit" class="boton" value="New Player" onclick="reset()">
                </div>
                <div id="contenedor" class="right_f">
                    <b><label id="questionName">Player</label></b>
                    <input id="player_name" type="text" class="centrado" maxlength="10" required pattern="[a-zA-Z]" placeholder="your name" value="anonimus">
                    <input id="botonsub" type="submit" class="boton" value="Submit" onclick="register_name(player_name)">
                </div>            
        </nav>
        
        <div class="flex-container">
            <div class="flex2 juego">
                <img id="cpuChoice" src="images/cpu.png" alt="Piedra" class="machineColor" width="256" height="256">
                <figcaption>Machine bet</figcaption>
            </div>
            <div class="flex2 juego">
             <div class="tabla">
                <h2>Results</h2>
                <hr>
                <p>Bets :   <output id="outBets" name="Bets">0</output></p>
                <p>Won :    <output id="outWon" name="Won">0</output></p>
                <p>Losses : <output id="outLosses" name="Losses">0</output></p>
                <p>Draw :   <output id="outDraw" name="Draw">0</output></p>
             </div>
            </div>
            <div class="flex2 juego">
                <img id="playerChoice" src="images/player.webp" alt="Papel" class="playerColor" width="256" height="256">
                <figcaption>Player bet</figcaption>
            </div>
        
        </div>

        <div class="flex-container partida">
            <div class="flex2 juego">
                <img id="bs" class="select" src="images/piedra.jpg" alt="Piedra" width="200" 
                onclick="oneselect(2)"
                ondblclick="select(2)"></div>
            <div class="flex2 juego">
                <img id="bt" class="select" src="images/tijera.jpg" alt="Tijera" width="200" 
                onclick="oneselect(3)"
                ondblclick="select(3)"></div>
            <div class="flex2 juego">
                <img id="bp" class="select" src="images/papel.jpg" alt="Papel" width="200" 
                onclick="oneselect(1)"
                ondblclick="select(1)"></div>
        </div>
        
        
    </main>

    <footer> <!-- Common to all pages -->
        
            <details>
                <summary>
                    <a href="mailto:mrrmvgl@gmail.com?Subject=Me%20pongo%20en%20contacto%20con%20usted">By Vicente García</a>
                </summary>
                    All rights reserved. The content provided is for informational purposes only and the author assumes no liability for errors, omissions, or consequences arising from its use.
            </details>
            <a href="about.html">About</a>
        
    </footer>
</body>
</html>
